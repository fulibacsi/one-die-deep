<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SONAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Layout: a nautical chart by day, a sonar scope by night. Hull and depth on
   top, the trench as an 8x8 grid, the last encounter and its die beside it. */
:root {
  --bg: #e9eef0; --raised: #f7fafa; --fg: #13303a; --soft: #557079; --line: #c6d4d8;
  --accent: #0f7c8c; --good: #1d7a52; --bad: #b8353f; --water: #d7e3e6; --deep: #2b4a55;
  --font-display: 'Martian Mono', ui-monospace, monospace;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #04161c; --raised: #082129; --fg: #b8f1ea; --soft: #5f9a96; --line: #11363f;
    --accent: #3fe0cf; --good: #6ff0b0; --bad: #ff6b7a; --water: #0b2a33; --deep: #021014; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #04161c; --raised: #082129; --fg: #b8f1ea; --soft: #5f9a96; --line: #11363f;
  --accent: #3fe0cf; --good: #6ff0b0; --bad: #ff6b7a; --water: #0b2a33; --deep: #021014; color-scheme: dark;
}
body { background: radial-gradient(circle at 50% 0%, var(--raised), var(--bg) 70%); }
.top h1 { letter-spacing: 0.12em; font-size: clamp(22px, 5vw, 32px); }

.screen { min-height: 0; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "hud hud" "board panel"; }
@media (max-width: 760px) { .screen { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; grid-template-areas: "hud" "board" "panel"; overflow: auto; } }
.hud { grid-area: hud; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 10px 14px; }
.hud .grow { flex: 1 1 140px; display: grid; gap: 4px; }
.panel { grid-area: panel; display: grid; gap: 12px; align-content: start; align-self: start; }
.panel h2 { margin: 0; font-size: 18px; }

.board { grid-area: board; min-height: 0; display: grid; place-items: center; }
.grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
  width: min(100%, 560px, calc(100dvh - 190px)); aspect-ratio: 1;
}
@media (max-width: 760px) { .grid { width: 100%; } }
.cell {
  aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; position: relative;
  background: var(--deep); color: var(--fg);
  font-family: var(--font-mono); font-weight: 600; font-size: clamp(11px, 3.2vw, 17px);
  display: grid; place-items: center;
}
.cell:hover:not(.open) { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell.open { background: var(--water); cursor: default; }
.cell.mark::after { content: "!"; color: var(--bad); font-size: 1.2em; }
.cell .e0 { opacity: 0; }
.cell .ehi { color: var(--bad); }
.cell .foe { width: 72%; height: 72%; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--bad); color: var(--bad); text-decoration: line-through; }
.cell .boss { border-width: 3px; }
.cell .pearl { position: absolute; width: 22%; height: 22%; right: 10%; bottom: 10%; border-radius: 50%; background: var(--good); opacity: 0.7; }

.fight { display: flex; gap: 14px; align-items: center; }
.what { font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
.math { font-family: var(--font-mono); font-size: 12px; color: var(--soft); }
.ok { color: var(--good); } .bad { color: var(--bad); }
.btn.on { background: var(--accent); color: var(--raised); border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>SONAR</h1>
    <a class="back" href="../index.html">← All prototypes</a>
    <div class="spacer"></div>
    <button class="btn ghost" id="sound" type="button" aria-pressed="true">Sound on</button>
  </header>
  <main id="screen" class="screen"></main>
</div>
<script type="module" src="ui.js"></script>
</body>
</html>
