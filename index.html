<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Die Deep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the dungeon is drafted on graph paper (blueprint at night);
   hero sheet left, map centre, the die and its choices right. */
:root {
  --paper: #edf1f4;
  --paper-raised: #f9fbfc;
  --grid: #dae2e9;
  --line: #b4c2ce;
  --ink: #17273a;
  --ink-soft: #5b6c7e;
  --hero: #c9701a;
  --foe: #b3304b;
  --good: #2a7f55;
  --font-display: 'Saira Stencil One', 'Archivo', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d2134; --paper-raised: #11293f; --grid: #163550; --line: #2a4e6d;
    --ink: #dbe8f2; --ink-soft: #8fa7bb; --hero: #f2b443; --foe: #ff7384; --good: #5fd39b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d2134; --paper-raised: #11293f; --grid: #163550; --line: #2a4e6d;
  --ink: #dbe8f2; --ink-soft: #8fa7bb; --hero: #f2b443; --foe: #ff7384; --good: #5fd39b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hero); outline-offset: 2px; }

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(30px, 6vw, 44px);
  line-height: 1;
  letter-spacing: 0.02em;
  margin: 0;
}
.depth { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.depth-steps { display: flex; gap: 4px; }
.depth-steps i { width: 12px; height: 12px; border: 1.5px solid var(--ink-soft); }
.depth-steps i.done { background: var(--ink-soft); }
.depth-steps i.here { background: var(--hero); border-color: var(--hero); }
.top .spacer { flex: 1; }

/* ---------- shared pieces ---------- */
.box { background: var(--paper-raised); border: 1.5px solid var(--ink); padding: 16px; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px;
  background: var(--paper-raised); border: 1.5px solid var(--ink); border-radius: 0;
  font-weight: 600; cursor: pointer; text-align: left;
}
.btn:hover:not(:disabled) { background: var(--grid); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--paper-raised); }
.btn.primary:hover:not(:disabled) { background: var(--ink-soft); }
.btn kbd { font-family: var(--font-mono); font-size: 11px; font-weight: 400; opacity: 0.65; }
.btn.ghost { border-color: var(--line); font-weight: 500; }

/* ---------- board ---------- */
/* Phones read top to bottom: vitals, map, choices, then gear and skills. */
.board {
  display: grid; gap: 18px; align-items: start;
  grid-template-columns: 250px minmax(0, 1fr) 350px;
  grid-template-areas: "vitals map panel" "kit map panel";
  grid-template-rows: auto 1fr;
}
.vitals { grid-area: vitals; } .kit { grid-area: kit; } .map-area { grid-area: map; } .panel { grid-area: panel; }
@media (max-width: 1020px) {
  .board { grid-template-columns: minmax(0, 1fr) 330px; grid-template-areas: "vitals vitals" "map panel" "kit kit"; grid-template-rows: auto; }
}
@media (max-width: 700px) {
  .board { grid-template-columns: minmax(0, 1fr); grid-template-areas: "vitals" "map" "panel" "kit"; }
}

/* hero sheet */
.sheet { display: grid; gap: 16px; }
@media (max-width: 1020px) and (min-width: 560px) { .sheet { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
@media (max-width: 1020px) { .vitals .who { grid-column: 1 / -1; } }
.who { display: flex; align-items: center; gap: 12px; }
.who svg { flex: none; }
.who-name { font-weight: 700; font-size: 18px; line-height: 1.1; }
.track { display: grid; gap: 6px; }
.track-head { display: flex; justify-content: space-between; align-items: baseline; }
.segs { display: flex; flex-wrap: wrap; gap: 2px; }
.segs i { width: 8px; height: 14px; border: 1.5px solid var(--ink-soft); }
.segs.hp i.on { background: var(--good); border-color: var(--good); }
.segs.focus i { transform: rotate(45deg) scale(0.75); width: 12px; height: 12px; margin-right: 2px; }
.segs.focus i.on { background: var(--hero); border-color: var(--hero); }
.xpbar { height: 6px; border: 1.5px solid var(--ink-soft); }
.xpbar b { display: block; height: 100%; background: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0; }
.stats div { border: 1.5px solid var(--line); padding: 6px 8px; }
.stats div.main { border-color: var(--hero); }
.stats div.main dt { color: var(--hero); }
.stats dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.stats dd { margin: 0; font-family: var(--font-mono); font-size: 22px; font-weight: 600; line-height: 1.1; }
.stats dd small { font-size: 11px; color: var(--good); font-weight: 400; margin-left: 2px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.list li .label { padding-top: 2px; }
.muted { color: var(--ink-soft); }
.skills li { grid-template-columns: minmax(0, 1fr); gap: 0; }
.skills li.locked { color: var(--ink-soft); }
.skills b { font-weight: 600; }

/* map */
.map-wrap { position: relative; width: 100%; max-width: 640px; margin: 0 auto; aspect-ratio: 1; }
.map-wrap svg { display: block; width: 100%; height: 100%; }
.map-wrap .room { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 2.5; }
.map-wrap .room.unknown { fill: none; stroke: var(--ink-soft); stroke-dasharray: 6 5; }
.map-wrap .room.here { stroke: var(--hero); stroke-width: 4; }
.map-wrap .reach { cursor: pointer; }
/* Unexplored rooms have no fill, and SVG only takes clicks on the painted
   parts of a shape. Make the whole room take the click or tap. */
.map-wrap .reach .room { pointer-events: all; }
.map-wrap .reach:hover .room, .map-wrap .reach:focus-visible .room { fill: var(--grid); }
.map-wrap .reach:focus-visible { outline: none; }
.map-wrap .reach:focus-visible .room { stroke: var(--hero); }
.map-wrap .door { stroke: var(--ink); stroke-width: 6; }
.map-wrap .door.unknown { stroke: var(--ink-soft); stroke-width: 3; stroke-dasharray: 4 4; }
.g-hero { fill: var(--hero); }
.g-foe { fill: var(--foe); }
.g-foe-line { fill: none; stroke: var(--foe); stroke-width: 2.5; }
.g-ink { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: square; }
.g-spent { fill: none; stroke: var(--ink-soft); stroke-width: 3; stroke-linejoin: miter; }
.g-letter { fill: var(--paper-raised); font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
.g-tag { fill: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; }

/* panel */
.panel { display: grid; gap: 16px; }
.panel h2 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.foe-card { display: grid; gap: 8px; }
.foe-stats { display: flex; gap: 14px; flex-wrap: wrap; }
.foe-stats span { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
.foe-stats b { color: var(--ink); font-size: 16px; }
.segs.foe i.on { background: var(--foe); border-color: var(--foe); }

.roll { display: grid; gap: 10px; }
.roll-top { display: flex; align-items: center; gap: 16px; }
.verdict { display: grid; gap: 2px; font-family: var(--font-mono); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.verdict .ok { color: var(--good); }
.verdict .no { color: var(--foe); }
.verdict .note { font-family: var(--font-body); font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.die {
  width: 84px; height: 84px; padding: 12px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  background: var(--paper-raised); border: 2.5px solid var(--ink); border-radius: 14px;
}
.die i { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.blank { border-style: dashed; border-color: var(--ink-soft); }
.die.six { border-color: var(--hero); }
.die.six i { background: var(--hero); }
.die.one i { background: var(--foe); }
.die.rolling { animation: tumble 0.42s ease-out; }
@keyframes tumble {
  0% { transform: rotate(-200deg) scale(0.7); }
  70% { transform: rotate(15deg) scale(1.05); }
  100% { transform: rotate(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }
.checks { display: grid; gap: 6px; min-width: 0; }
.check { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; align-items: baseline; }
.check .math { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
.check.ok .label { color: var(--good); }
.check.no .label { color: var(--foe); }
.table6 { display: grid; gap: 2px; font-size: 13px; }
.table6 div { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 2px 6px; }
.table6 div.hit { background: var(--ink); color: var(--paper-raised); }
.table6 .num { font-size: 12px; }

.actions { display: grid; gap: 8px; }
.actions .row { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .row .btn { flex: 1 1 auto; }
.skill-btn { flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 12px; }
.skill-btn span { font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.skill-btn .cost { color: var(--hero); font-family: var(--font-mono); font-size: 11px; }
.choice { display: grid; gap: 8px; }
.choice .btn { flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; }
.choice .btn span { font-weight: 400; font-size: 13px; color: var(--ink-soft); }
.item { border: 1.5px solid var(--line); padding: 10px 12px; display: grid; gap: 2px; }
.item.rare { border-color: var(--hero); }
.item b { font-size: 16px; }
.note { font-size: 13px; color: var(--ink-soft); margin: 0; }

.log { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1.5px solid var(--line); display: grid; gap: 4px; font-size: 13px; }
.log li { color: var(--ink-soft); }
.log li:first-child { color: var(--ink); }
.kit-head, .kit-log, #details { display: none; }

/* Touch screens: show where you can move, and drop keyboard hints. */
@media (hover: none) {
  .map-wrap .reach .room { stroke: var(--hero); }
}
@media (pointer: coarse) {
  .btn kbd { display: none; }
}

/* ---------- phone, portrait: one screen, no scrolling while you play ----------
   Vitals strip on top, the map takes whatever height is left, the encounter
   and its buttons sit at the bottom in thumb reach. Gear, skill text and the
   full log open as a bottom sheet from the Hero button. */
@media (max-width: 700px) and (orientation: portrait) {
  html, body { height: 100%; }
  .app.playing { height: 100%; padding-block: 8px; gap: 8px; grid-template-rows: auto minmax(0, 1fr); font-size: 14px; }
  .playing .top { flex-wrap: nowrap; gap: 6px; }
  .playing .title { font-size: 20px; white-space: nowrap; }
  .playing .wide-only { display: none; }
  .playing .depth { gap: 0; }
  .playing .depth > span:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .playing .depth-steps i { width: 9px; height: 9px; }
  .playing .top .btn { min-height: 32px; padding: 4px 9px; font-size: 13px; }
  .playing #details { display: inline-flex; }
  .playing #screen { min-height: 0; }

  .board { height: 100%; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(120px, 1fr) auto; grid-template-areas: "vitals" "map" "panel"; }

  .vitals {
    padding: 8px 12px; gap: 6px 14px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "who stats" "hp hp" "focus xp";
  }
  /* Each bar on one line: label, pips, number. */
  .vitals .track { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .vitals .track-head { display: contents; }
  .vitals .track .label { grid-column: 1; }
  .vitals .track .segs, .vitals .track .xpbar { grid-column: 2; grid-row: 1; }
  .vitals .track .num { grid-column: 3; font-size: 13px; }
  .vitals .stats { justify-self: end; }
  .vitals .who { grid-area: who; gap: 8px; }
  .vitals .who svg { width: 26px; height: 26px; }
  .vitals .who-name { font-size: 15px; }
  .vitals .stats { grid-area: stats; grid-template-columns: repeat(3, auto); gap: 4px; align-self: center; }
  .vitals .stats div { padding: 1px 6px; }
  .vitals .stats dt { font-size: 9px; }
  .vitals .stats dd { font-size: 16px; }
  .t-hp { grid-area: hp; } .t-focus { grid-area: focus; } .t-xp { grid-area: xp; align-self: start; }
  .vitals .segs i { height: 11px; }
  .vitals .segs.focus i { width: 10px; height: 10px; }

  .map-area { min-height: 0; height: 100%; }
  .map-wrap { height: 100%; max-width: none; aspect-ratio: auto; }

  .panel { padding: 10px 12px; gap: 8px; }
  .panel h2 { font-size: 17px; }
  .foe-card { gap: 4px; }
  .foe-stats { gap: 10px; }
  .foe-stats span { font-size: 12px; }
  .foe-stats b { font-size: 14px; }
  .roll { gap: 6px; }
  .roll-top { gap: 12px; }
  .die { width: 52px; height: 52px; padding: 7px; border-radius: 10px; border-width: 2px; }
  .die i { width: 9px; height: 9px; }
  .verdict { font-size: 15px; }
  .check { grid-template-columns: 44px minmax(0, 1fr); }
  .check .math { font-size: 11px; }
  .table6 { font-size: 12px; gap: 0; }
  .table6 div { padding: 1px 6px; }
  .note { font-size: 12px; }
  .actions { gap: 6px; }
  .actions .row { gap: 6px; }
  .actions .btn { min-height: 44px; }
  /* Combat: Attack, Flee and Potion share a row; skills go below. */
  .mode-combat .actions { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "main aux" "skills skills"; }
  .main-row { grid-area: main; } .aux-row { grid-area: aux; flex-wrap: nowrap; } .skill-row { grid-area: skills; flex-wrap: nowrap; }
  .aux-row .btn, .skill-row .btn { flex: 1 1 0; min-width: 0; padding-inline: 8px; }
  /* Loot and level-up already say what happened; the old roll can go. */
  .mode-levelup .roll, .mode-loot .roll { display: none; }
  .table6 { display: none; }
  .skill-btn { padding: 6px 10px; }
  .skill-btn span:not(.cost) { display: none; }
  .choice { gap: 6px; }
  .choice .btn { padding: 6px 12px; min-height: 40px; flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; }
  .choice .btn b { white-space: nowrap; }
  .choice .btn span { font-size: 12px; text-align: right; }
  .item { padding: 6px 10px; }
  .panel .log { padding-top: 6px; }
  .panel .log li:not(:first-child) { display: none; }

  .kit { display: none; }
  .board.show-kit .kit {
    display: grid; position: fixed; z-index: 20; inset: auto 0 0 0; max-height: 78%; overflow: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    border-width: 1.5px 0 0; box-shadow: 0 -12px 32px rgb(0 0 0 / 0.25);
  }
  .kit-head { display: flex; justify-content: space-between; align-items: center; }
  .kit-log { display: grid; gap: 4px; }
}
/* Short phones (iPhone SE and the like): keep the verdict, drop the math
   and the log line; both stay in the Hero sheet's log. */
@media (max-width: 700px) and (orientation: portrait) and (max-height: 600px) {
  .playing .checks, .playing .panel .log { display: none; }
  .playing .mode-explore .note { display: none; }
}

/* ---------- motion: one-shot effects picked by ui.js from the last action ---------- */
.track, .foe-card { position: relative; }
.float {
  position: absolute; right: 0; top: -4px; pointer-events: none;
  font-family: var(--font-mono); font-weight: 600; font-size: 18px;
  opacity: 0;
}
.float.bad { color: var(--foe); }
.float.good { color: var(--good); }
.float.crit { color: var(--hero); font-size: 24px; }
.float.soft { color: var(--ink-soft); }
.float + .float { top: 18px; }
.vitals .float { right: auto; left: 40px; }
.burst { fill: none; stroke: var(--foe); stroke-width: 3; opacity: 0; }
.burst-core { fill: var(--foe); stroke: none; }

@media (prefers-reduced-motion: no-preference) {
  .hero-g.glide { animation: glide 200ms cubic-bezier(0.2, 0.8, 0.3, 1); }
  @keyframes glide { from { transform: translate(var(--fx), var(--fy)) scale(var(--fs)); } }

  .map-wrap .fresh { transform-box: fill-box; transform-origin: center; animation: reveal 360ms 120ms ease-out backwards; }
  .map-wrap line.fresh { animation-name: fade; }
  @keyframes reveal { from { opacity: 0; transform: scale(0.75); } }
  @keyframes fade { from { opacity: 0; } }

  .map-wrap.leaving { animation: sink 260ms ease-in forwards; }
  .map-wrap.arriving { animation: rise 420ms cubic-bezier(0.2, 0.8, 0.3, 1); }
  @keyframes sink { to { opacity: 0; transform: translateY(16px) scale(0.94); } }
  @keyframes rise { from { opacity: 0; transform: translateY(-16px) scale(1.04); } }

  .glyph.struck { animation: blink 280ms steps(2, jump-none) 2; }
  @keyframes blink { 50% { opacity: 0.15; } }
  .burst { transform-box: fill-box; transform-origin: center; animation: burst 480ms ease-out; }
  .burst-core { animation-name: burst-core; }
  @keyframes burst { from { opacity: 1; transform: scale(0.6); } to { opacity: 0; transform: scale(2.6); } }
  @keyframes burst-core { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.2) rotate(90deg); } }

  .float { animation: float 950ms ease-out; }
  @keyframes float { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }

  .foe-card.struck h2, .foe-card.struck .segs { animation: knock 280ms ease-out; }
  @keyframes knock { 0%, 100% { transform: none; } 25% { transform: translateX(7px); } 55% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  .segs i.lost { animation: lost 600ms ease-out; }
  .segs i.gained { animation: gained 600ms ease-out; }
  @keyframes lost { 0% { background: var(--foe); border-color: var(--foe); transform: scale(1.25); } }
  @keyframes gained { 0% { transform: scale(1.5); } }

  .board.shake-soft { animation: shake 240ms ease-out; }
  .board.shake-hard { animation: shake-hard 320ms ease-out; }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-3px, 1px); } 45% { transform: translate(3px, -1px); } 70% { transform: translate(-2px, 0); } }
  @keyframes shake-hard { 0%, 100% { transform: none; } 15% { transform: translate(-6px, 2px); } 35% { transform: translate(6px, -2px); } 55% { transform: translate(-4px, 1px); } 75% { transform: translate(3px, 0); } }
  .vitals.shake .segs.hp { animation: knock 280ms ease-out; }

  .die.pop { animation: pop 360ms cubic-bezier(0.3, 1.6, 0.5, 1); }
  .die.wobble { animation: wobble 360ms ease-out; }
  @keyframes pop { from { transform: scale(1.25); } }
  @keyframes wobble { 0%, 100% { transform: none; } 25% { transform: rotate(-10deg); } 60% { transform: rotate(6deg); } }

  .enter { animation: enter 260ms ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  .panel.celebrate { animation: celebrate 900ms ease-out; }
  @keyframes celebrate { from { box-shadow: 0 0 0 0 var(--hero); } 40% { box-shadow: 0 0 0 8px var(--hero); } to { box-shadow: 0 0 0 16px transparent; } }
  .label.pulse { animation: pulse 900ms ease-out; display: inline-block; }
  @keyframes pulse { 30% { color: var(--hero); transform: scale(1.3); } }
}

/* start screen */
.start { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .start { grid-template-columns: minmax(0, 1fr); } }
.start h2 { margin: 0 0 4px; font-size: 22px; }
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.class-card { display: grid; gap: 10px; align-content: start; text-align: left; cursor: pointer; background: var(--paper-raised); border: 1.5px solid var(--ink); padding: 16px; }
.class-card:hover { background: var(--grid); }
.class-card .who-name { font-size: 20px; }
.class-card .mini { display: flex; gap: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.class-card .mini b { color: var(--ink); font-size: 15px; }
.class-card .mini .main, .class-card .mini .main b { color: var(--hero); }
.rules { display: grid; gap: 10px; }
.rules p { margin: 0; max-width: 60ch; }
.rules strong { font-weight: 700; }
</style>
