<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARHOLD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Layout: a star chart. Light is a printed chart, dark is deep space.
   Your empire and fleet between campaigns; the galaxy and battle console during one. */
:root {
  --bg: #eef1f7; --raised: #fbfcff; --fg: #1b2440; --soft: #5a6585; --line: #d3d9e8;
  --accent: #0f7487; --good: #1f7a4d; --bad: #b3352b; --zero: #a86f00; --territory: #d7ecef; --star: #d99400;
  --alloys: #56677f; --fuel: #c05a12; --labor: #7b4aa6;
  --font-display: 'Orbitron', 'IBM Plex Sans', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e1a; --raised: #111829; --fg: #dbe3ff; --soft: #8592b8; --line: #252f4d;
    --accent: #5ed3e6; --good: #6fdc9c; --bad: #ff6b6b; --zero: #ffd166; --territory: #12313a; --star: #ffd27a;
    --alloys: #aab9d1; --fuel: #ff9f43; --labor: #c59dff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e1a; --raised: #111829; --fg: #dbe3ff; --soft: #8592b8; --line: #252f4d;
  --accent: #5ed3e6; --good: #6fdc9c; --bad: #ff6b6b; --zero: #ffd166; --territory: #12313a; --star: #ffd27a;
  --alloys: #aab9d1; --fuel: #ff9f43; --labor: #c59dff; color-scheme: dark;
}
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle at 20% 30%, var(--line) 1px, transparent 1.5px), radial-gradient(circle at 70% 80%, var(--line) 1px, transparent 1.5px);
  background-size: 90px 90px, 130px 130px;
  font-size: 14px;
}
.top h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 700; letter-spacing: 0.12em; }

.screen { min-height: 0; display: grid; gap: 14px; align-content: start; }
.hub { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.campaign { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "hud hud" "map panel"; height: 100%; }
@media (max-width: 760px) {
  .hub { grid-template-columns: minmax(0, 1fr); overflow: auto; }
  /* The galaxy is a 6×6 chart: give it room to tap, and let the page scroll. */
  .app { height: auto; min-height: 100%; }
  .campaign { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(300px, 1fr) auto; grid-template-areas: "hud" "map" "panel"; gap: 8px; }
  /* Phones: one-line header, a tighter console, the galaxy gets the room. */
  .top { flex-wrap: nowrap; gap: 8px; }
  .top h1 { font-size: 22px; }
  .top .btn { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .back { font-size: 12px; white-space: nowrap; }
  .hud { padding: 8px 10px; gap: 6px 14px; }
  .panel { gap: 8px; padding: 10px 12px; }
  .panel .note { font-size: 12px; }
  .panel .log li:not(:first-child) { display: none; }
}
.box { border-radius: 4px; }
.box h2, .panel h2 { margin: 0; font-size: 18px; }
.hud { grid-area: hud; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 14px; }
.hud .grow { flex: 1 1 160px; display: grid; gap: 4px; }
.map { min-height: 0; display: flex; justify-content: center; }
.campaign .map { grid-area: map; }
.map svg { width: 100%; height: 100%; max-height: 640px; }
.hub .map svg { max-height: 340px; }
.panel { grid-area: panel; display: grid; gap: 12px; align-content: start; align-self: start; }

.res { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.res span { display: inline-flex; align-items: baseline; gap: 6px; }
.res i { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
.res .alloys i { background: var(--alloys); } .res .fuel i { background: var(--fuel); } .res .labor i { background: var(--labor); }
.res b { font-family: var(--font-mono); font-size: 18px; }
.res small { color: var(--soft); font-family: var(--font-mono); }

.strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.strip span { text-align: center; font-weight: 600; font-family: var(--font-mono); padding: 4px 0; border: 1.5px solid var(--fg); }
.strip .prg { background: var(--fg); color: var(--raised); }
.strip .zd { background: var(--zero); color: var(--raised); border-color: var(--zero); }
.strip .ens { background: transparent; }
.legend { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--soft); }

.ups { display: grid; gap: 8px; }
.up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border: 1.5px solid var(--line); padding: 8px 10px; }
.up b { font-size: 14px; }
.up .note { grid-column: 1; }
.up .btn { grid-row: 1 / span 2; grid-column: 2; min-width: 104px; }
.lv { font-size: 11px; color: var(--soft); }

/* The galaxy from above: stars with turning planets, lanes between systems. */
.map .lane { stroke: var(--soft); stroke-width: 2.5; opacity: 0.55; }
.map .lane.held { stroke: var(--accent); stroke-width: 3.5; opacity: 0.9; }
.map .lane.unknown { stroke-dasharray: 4 5; opacity: 0.45; }
.map .rim { fill: none; stroke: var(--line); stroke-width: 2; }
.map .rim.owned { fill: var(--territory); stroke: var(--accent); stroke-width: 2.5; }
.map .rim.unknown { stroke: var(--soft); stroke-dasharray: 5 5; opacity: 0.7; }
.map .path { fill: none; stroke: var(--soft); stroke-width: 1; opacity: 0.4; }
.map .star { fill: var(--star); }
.map .star.home { fill: var(--accent); }
.map .star.core { fill: var(--bad); }
.map .halo { opacity: 0.22; }
.map .planet.alloys, .map .badge.alloys { fill: var(--alloys); }
.map .planet.fuel, .map .badge.fuel { fill: var(--fuel); }
.map .badge.labor { fill: var(--labor); }
.map .planet.dust { fill: var(--soft); }
.map .foe { fill: var(--bad); }
.map .foe.rebel { fill: var(--zero); }
.map .b-num { fill: var(--raised); font-family: var(--font-mono); font-weight: 600; font-size: 13px; text-anchor: middle; }
.map .tag { fill: var(--soft); font-family: var(--font-mono); font-size: 15px; text-anchor: middle; }
.map .wreck { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; }
.map .fleet-path { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 4; opacity: 0.8; }
.map .ship { fill: var(--accent); }
/* Orbits turn about the star: each group's box is centered on it. Reduced
   motion stops them where they are (base.css turns animations off). */
.map .spin { transform-box: fill-box; transform-origin: center; animation-name: orbit; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.map .sys * { pointer-events: none; }
.map .reach { cursor: pointer; }
.map .reach .rim { pointer-events: all; }
.map .reach:hover .rim { stroke: var(--accent); }
.map .reach:focus-visible { outline: none; }
.map .reach:focus-visible .rim { stroke: var(--accent); stroke-width: 3.5; }
@media (hover: none) { .map .reach.next .rim { stroke: var(--accent); stroke-dasharray: none; } }
.bar.unrest b { background: var(--bad); }
.hud-like { display: grid; gap: 4px; }

.result { display: flex; gap: 14px; align-items: center; }
.result .what { font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; }
.dice { display: flex; gap: 6px; flex: none; }
.dice .die { width: 48px; height: 48px; padding: 7px; border-radius: 10px; }
.dice .die i { width: 8px; height: 8px; }
.dice .die.hit { border-color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }
.dice .die.hit.zd { border-color: var(--zero); box-shadow: inset 0 0 0 2px var(--zero); }
.dice .die.miss { opacity: 0.4; }
.btn.attack { display: grid; gap: 2px; justify-items: center; }
.ok { color: var(--good); } .bad { color: var(--bad); } .zero { color: var(--zero); }
.layers { display: flex; gap: 3px; flex-wrap: wrap; }
.layers i { width: 12px; height: 12px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: var(--bad); }
.layers i.off { background: var(--line); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row > .btn.ghost.small { flex: 0 0 auto; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>STARHOLD</h1>
    <a class="back" href="../index.html">← All prototypes</a>
    <div class="spacer"></div>
    <button class="btn ghost" id="sound" type="button" aria-pressed="true">Sound on</button>
  </header>
  <main id="screen" class="screen"></main>
</div>
<script type="module" src="ui.js"></script>
</body>
</html>
