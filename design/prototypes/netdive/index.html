<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NETDIVE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Layout: printout of a network dive. Light is green-bar printer paper,
   dark is an amber CRT. Rig and upgrades between dives; map and console during one. */
:root {
  --bg: #f3f6f0; --stripe: #e2eedc; --raised: #fbfdf9; --fg: #1c2a22; --soft: #5d7265; --line: #cddbcc;
  --accent: #1d7348; --good: #1d7348; --bad: #b3352b; --zero: #b86e00;
  --font-display: 'VT323', 'IBM Plex Mono', ui-monospace, monospace;
  --font-body: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130d05; --stripe: #191207; --raised: #1b1309; --fg: #ffb547; --soft: #b17c37; --line: #3b2b14;
    --accent: #ffcd6b; --good: #ffd889; --bad: #ff6a4d; --zero: #fff0c4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130d05; --stripe: #191207; --raised: #1b1309; --fg: #ffb547; --soft: #b17c37; --line: #3b2b14;
  --accent: #ffcd6b; --good: #ffd889; --bad: #ff6a4d; --zero: #fff0c4; color-scheme: dark;
}
body { background: repeating-linear-gradient(var(--bg) 0 48px, var(--stripe) 48px 96px); font-size: 14px; }
.top h1 { font-size: clamp(30px, 6vw, 44px); letter-spacing: 0.08em; }

.screen { min-height: 0; display: grid; gap: 14px; align-content: start; }
.hub { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
.dive { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "hud hud" "map panel"; height: 100%; }
@media (max-width: 760px) {
  .hub { grid-template-columns: minmax(0, 1fr); overflow: auto; }
  .dive { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(220px, 1fr) auto; grid-template-areas: "hud" "map" "panel"; gap: 8px; }
  /* Phones: one-line header, a tighter console, the map gets the room. */
  .top { flex-wrap: nowrap; gap: 8px; }
  .top h1 { font-size: 28px; }
  .top .btn { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .back { font-size: 12px; white-space: nowrap; }
  .hud { padding: 8px 10px; gap: 6px 14px; }
  .panel { gap: 8px; padding: 10px 12px; }
  .panel .note { font-size: 12px; }
  .panel .log li:not(:first-child) { display: none; }
}
.hud { grid-area: hud; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 14px; }
.hud .grow { flex: 1 1 160px; display: grid; gap: 4px; }
.map { grid-area: map; min-height: 0; display: flex; justify-content: center; }
.map svg { width: 100%; height: 100%; max-height: 640px; }
.panel { grid-area: panel; display: grid; gap: 12px; align-content: start; align-self: start; }
.panel h2, .box h2 { margin: 0; font-size: 18px; }

.strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.strip span { text-align: center; font-weight: 600; padding: 4px 0; border: 1.5px solid var(--fg); }
.strip .brk { background: var(--accent); color: var(--raised); }
.strip .zd { background: var(--zero); color: var(--raised); }
.strip .spf { background: transparent; }
.legend { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--soft); }

.ups { display: grid; gap: 8px; }
.up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border: 1.5px solid var(--line); padding: 8px 10px; }
.up b { font-size: 14px; }
.up .note { grid-column: 1; }
.up .btn { grid-row: 1 / span 2; grid-column: 2; min-width: 96px; }
.lv { font-size: 11px; color: var(--soft); }

.map .room { fill: var(--raised); stroke: var(--fg); stroke-width: 3; }
.map .room.unknown { fill: none; stroke: var(--soft); stroke-dasharray: 6 5; }
.map .room.here { stroke: var(--accent); stroke-width: 5; }
.map .door { stroke: var(--fg); stroke-width: 5; }
.map .door.unknown { stroke: var(--soft); stroke-width: 2.5; stroke-dasharray: 4 4; }
.map .reach { cursor: pointer; }
.map .reach .room { pointer-events: all; }
.map .reach:hover .room { fill: var(--line); }
@media (hover: none) { .map .reach .room { stroke: var(--accent); } }
.g-ice { fill: var(--bad); }
.g-tag { fill: var(--soft); font-family: var(--font-mono); font-size: 18px; }
.g-ink { fill: none; stroke: var(--fg); stroke-width: 3.5; }
.g-soft { fill: none; stroke: var(--soft); stroke-width: 3; }
.g-hero { fill: var(--accent); }
.g-num { fill: var(--raised); font-family: var(--font-mono); font-weight: 600; font-size: 16px; }

.result { display: flex; gap: 14px; align-items: center; }
.result .what { font-weight: 600; font-size: 16px; text-transform: uppercase; }
.ok { color: var(--good); } .bad { color: var(--bad); } .zero { color: var(--zero); }
.layers { display: flex; gap: 3px; }
.layers i { width: 14px; height: 14px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: var(--bad); }
.layers i.off { background: var(--line); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>NETDIVE</h1>
    <a class="back" href="../index.html">← All prototypes</a>
    <div class="spacer"></div>
    <button class="btn ghost" id="sound" type="button" aria-pressed="true">Sound on</button>
  </header>
  <main id="screen" class="screen"></main>
</div>
<script type="module" src="ui.js"></script>
</body>
</html>
